[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grace"
version = "0.1.0"
description = "GRACE — a terminal AI coding agent that works inside your local codebase — free AI coding assistance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["cli", "ai", "coding-agent", "agent", "developer-tools", "terminal"]
dependencies = [
    "requests>=2.31",
    "textual>=0.80",
    # Backend only (grace/server): the CLI never imports psycopg, but the
    # server and the API need it to reach the Neon/Postgres database. Kept in
    # the main dependency list so a Vercel deployment installs it from
    # pyproject.toml without extra configuration.
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
grace = "grace.cli.index:main"

[tool.setuptools.packages.find]
include = ["grace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Minimal, safe rule set — see docs/development.md ("Code quality").
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The Vercel functions in api/ must bootstrap sys.path before importing
# grace.*, so their imports are intentionally not at the top of the file.
"api/**" = ["E402"]
